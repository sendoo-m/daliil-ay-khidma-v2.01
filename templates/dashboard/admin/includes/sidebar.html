<div class="admin-sidebar {% if sidebar_wrapper == 'desktop' %}desktop-sidebar position-fixed end-0{% endif %}" {% if sidebar_wrapper == 'desktop' %}style="width:16.666667%; top:0;"{% endif %}>
    <div class="admin-header">
        <div class="admin-logo"><i class="fas fa-shield-alt"></i></div>
        <h6 class="text-white fw-bold">الإدارة</h6>
        <small class="text-white-50"><i class="fas fa-user me-1"></i>{{ user.username }}</small>
    </div>

    <nav class="nav flex-column mt-3 pb-4">
        <a class="nav-link {% if request.resolver_match.url_name == 'admin_home' %}active{% endif %}" href="{% url 'dashboard:admin_home' %}">
            <i class="fas fa-tachometer-alt"></i> الرئيسية
        </a>

        <hr class="text-white-50 mx-3 my-2">
        <span class="sidebar-section-label">المستخدمون</span>
        <a class="nav-link {% if 'user' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_users_list' %}">
            <i class="fas fa-users"></i> المستخدمون
        </a>

        <hr class="text-white-50 mx-3 my-2">
        <span class="sidebar-section-label">المواقع الجغرافية</span>
        <a class="nav-link {% if 'governorate' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_governorates_list' %}">
            <i class="fas fa-map-marked-alt"></i> المحافظات
        </a>
        <a class="nav-link {% if 'city' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_cities_list' %}">
            <i class="fas fa-city"></i> المدن
        </a>
        <a class="nav-link {% if 'district' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_districts_list' %}">
            <i class="fas fa-map-marker-alt"></i> الأحياء
        </a>

        <hr class="text-white-50 mx-3 my-2">
        <span class="sidebar-section-label">إدارة المحتوى</span>
        <a class="nav-link {% if 'business' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_businesses_list' %}">
            <i class="fas fa-store"></i> المحلات
        </a>
        <a class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_products_list' %}">
            <i class="fas fa-box"></i> المنتجات
        </a>
        <a class="nav-link {% if 'deal' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_deals_list' %}">
            <i class="fas fa-percent"></i> العروض
        </a>
        <a class="nav-link {% if 'review' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_reviews_list' %}">
            <i class="fas fa-star"></i> التقييمات
        </a>
        <a class="nav-link {% if 'categor' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_categories_list' %}">
            <i class="fas fa-list"></i> التصنيفات
        </a>

        <hr class="text-white-50 mx-3 my-2">
        <span class="sidebar-section-label">الاشتراكات</span>
        <a class="nav-link {% if request.resolver_match.namespace == 'subscriptions' %}active{% endif %}" href="{% url 'subscriptions:pricing_comparison' %}">
            <i class="fas fa-crown"></i> الأسعار والباقات
        </a>
        <a class="nav-link" href="{% url 'admin:subscriptions_subscriptionplan_changelist' %}">
            <i class="fas fa-layer-group"></i> إدارة الخطط
        </a>
        <a class="nav-link" href="{% url 'admin:subscriptions_subscription_changelist' %}">
            <i class="fas fa-receipt"></i> اشتراكات الأنشطة
        </a>

        <hr class="text-white-50 mx-3 my-2">
        <span class="sidebar-section-label">النظام</span>
        <a class="nav-link {% if 'analytics' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:admin_analytics' %}">
            <i class="fas fa-chart-line"></i> التحليلات
        </a>
        <a class="nav-link {% if 'settings' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'dashboard:settings' %}">
            <i class="fas fa-cog"></i> الإعدادات
        </a>
        <a class="nav-link" href="/admin/" target="_blank">
            <i class="fas fa-tools"></i> Django Admin
            <i class="fas fa-external-link-alt ms-1" style="font-size:.65rem;opacity:.5;"></i>
        </a>
    </nav>
</div>
