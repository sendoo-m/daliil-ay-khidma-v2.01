name: Backend

on:
  push:
    branches:
      - master
    paths:
      - 'apps/**'
      - 'config/**'
      - 'manage.py'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'config/**'
      - 'manage.py'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-only-secret-key
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run core API contract tests
        run: python manage.py test apps.api.tests --verbosity=2

      - name: Run authorization boundary tests
        run: python manage.py test apps.api.test_authorization --verbosity=2

      - name: Run counter protection tests
        run: python manage.py test apps.api.tests_counter_protection --verbosity=2
