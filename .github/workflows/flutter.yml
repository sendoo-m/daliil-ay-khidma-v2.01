name: Flutter

on:
  push:
    branches:
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Fast analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile/dalil_app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native projects
        run: flutter create --empty --platforms=android,ios,web --org=com.daliilaykhidma --project-name=dalil_app .
      - name: Configure password-reset deep links
        run: python3 tool/configure_deep_links.py
      - name: Configure Firebase clients
        run: python3 tool/configure_firebase.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android debug APK
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/dalil_app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --empty --platforms=android --org=com.daliilaykhidma --project-name=dalil_app .
      - name: Configure password-reset deep links
        run: python3 tool/configure_deep_links.py
      - name: Configure Firebase client
        run: python3 tool/configure_firebase.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://daliil-ay-khidma.onrender.com
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daliil-android-debug
          path: mobile/dalil_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: Build iOS without signing
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/dalil_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --empty --platforms=ios --org=com.daliilaykhidma --project-name=dalil_app .
      - name: Configure password-reset deep links
        run: python3 tool/configure_deep_links.py
      - name: Configure Firebase client
        run: python3 tool/configure_firebase.py
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --debug --no-codesign --dart-define=API_BASE_URL=https://daliil-ay-khidma.onrender.com
